<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Cazando</title>
  <link rel="stylesheet" href="cazando.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="utils.js"></script>
</head>
<body onload="iniciarJuego()">

  <div class="game-container">
    <header class="game-header">
      <h1>Juego Cazando</h1>
      <p class="author">Autor: Fabricio Quillupangui</p>
    </header>

    <div class="canvas-wrapper">
      <canvas id="areaJuego" width="500" height="500"></canvas>
    </div>

    <div class="panel">
      <div class="badge">Puntos: <span id="puntos">0</span></div>
      <div class="badge">Tiempo: <span id="tiempo">10</span>s</div>
    </div>

    <div class="controles">
      <div class="control-row">
        <button onclick="moverArriba()" class="btn-control">⬆</button>
      </div>
      <div class="control-row">
        <button onclick="moverIzquierda()" class="btn-control">⬅</button>
        <button onclick="moverAbajo()" class="btn-control">⬇</button>
        <button onclick="moverDerecha()" class="btn-control">➡</button>
      </div>
      <div class="control-row">
        <button onclick="reiniciar()" class="btn-action">Reiniciar</button>
      </div>
    </div>

    <p id="mensaje"></p>
  </div>

  <script src="cazando.js"></script>
</body>
</html>
